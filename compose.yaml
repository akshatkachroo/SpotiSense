name: spotisense

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotisense
      POSTGRES_USER: spotisense
      POSTGRES_PASSWORD: spotisense
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotisense -d spotisense"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      PORT: 8080
      TRACKS_PATH: /app/data/tracks.csv
      DATABASE_URL: postgres://spotisense:spotisense@postgres:5432/spotisense?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://localhost:8080
        VITE_EMOTION_MODEL: /models/spotisense-emotion
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
